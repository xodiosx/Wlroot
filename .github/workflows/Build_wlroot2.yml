name: Build wlroots2

on:
  workflow_dispatch:
  push:
    branches: [wlroots-display-client]
  pull_request:
    branches: [wlroots-display-client]
  
jobs:
  build:
    runs-on: ubuntu-latest


    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        repository: xodiosx/wlroots
        ref: wlroots-display-client
        submodules: recursive
    - name: Checkout termux-display-client repo
      uses: actions/checkout@v4
      with:
        repository: xodiosx/termux-display-clientx
        path: termux-display-clientx   
       
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install meson -y
        
        
        sudo apt install -y \
          ninja-build \
          clang pkg-config \
          libpixman-1-dev \
          libwayland-dev \
          wayland-protocols \
          libegl1-mesa-dev \
          libdrm-dev \
          libxkbcommon-dev \
          libgbm-dev \
          libudev-dev \
          libinput-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shm0-dev \
          libxcb-xfixes0-dev

    - name: Install Android NDK
      run: |
        # Download and install Android NDK
        wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
        unzip android-ndk-r27c-linux.zip -d $HOME
        echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27c" >> $GITHUB_ENV
        echo "PATH=$HOME/android-ndk-r27c:$PATH" >> $GITHUB_ENV  
        
    - name: Build termux-display-clientx with CMake
      run: |
          cd termux-display-clientx
          mkdir build && cd build
          cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=$HOME/tdc-install
          make -j$(nproc)
          make install
    - name: Create pkg-config file for termux-display-clientx
      run: |
        mkdir -p $HOME/tdc-install/lib/pkgconfig
        cat > $HOME/tdc-install/lib/pkgconfig/termux-display-client.pc <<EOF
        prefix=$HOME/tdc-install
        exec_prefix=\${prefix}
        libdir=\${prefix}/lib
        includedir=\${prefix}/include

    - name: Configure build
      run: |
       export PKG_CONFIG_PATH=$HOME/tdc-install/lib/pkgconfig:$PKG_CONFIG_PATH
        
        ls        
    
        meson setup build \
          --buildtype release \
          -Drenderers=auto \
          -Dbackends=termuxdc \
          -Dwerror=false 
          

        ninja -C build

    - name: Archive build output
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: wlroots-binaries
        path: |
          wlroot/build/
