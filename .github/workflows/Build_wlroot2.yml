name: Build wlroot2

on:
  workflow_dispatch:
  push:
    branches: [wlroots-display-client]
  pull_request:
    branches: [wlroots-display-client]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout wlroots repo
      uses: actions/checkout@v4
      with:
        repository: xodiosx/wlroots
        ref: wlroots-display-client
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          meson ninja-build \
          pkg-config \
          wayland-protocols \
          libpixman-1-dev \
          zip

    - name: Install Android NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
        unzip android-ndk-r27c-linux.zip -d $HOME
        echo "ANDROID_NDK=$HOME/android-ndk-r27c" >> $GITHUB_ENV
        echo "PATH=$HOME/android-ndk-r27c:$PATH" >> $GITHUB_ENV

    - name: Configure and build with Meson
      run: |
        export NDK=$HOME/android-ndk-r27c
        export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
        export AR=$TOOLCHAIN/bin/llvm-ar
        export CC=$TOOLCHAIN/bin/aarch64-linux-android26-clang
        export CXX=$TOOLCHAIN/bin/aarch64-linux-android26-clang++

        meson setup build \
          --cross-file <(cat <<EOF
        [binaries]
         c = '$CC'
         cpp = '$CXX'
         ar = '$AR'
         pkgconfig = 'pkg-config'

       [host_machine]
        system = 'android'
       cpu_family = 'aarch64'
       cpu = 'armv8-a'
       endian = 'little'
       EOF
          ) \
          --buildtype release \
          -Dbackends=termuxdc \
          -Drenderers=auto \
          -Dwerror=false

        ninja -C build

    - name: Zip build output
      run: |
        zip -r wlroots-arm64-build.zip build/

    - name: Upload zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: wlroots-arm64
        path: wlroots-arm64-build.zip
