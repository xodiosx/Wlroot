name: Build wlroots2

on:
  workflow_dispatch:
  push:
    branches: [wlroots-display-client]
  pull_request:
    branches: [wlroots-display-client]
  
jobs:
  build:
    runs-on: ubuntu-latest


    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        repository: xodiosx/wlroots
        ref: wlroots-display-client
        submodules: recursive
    - name: Checkout termux-display-client repo
      uses: actions/checkout@v4
      with:
        repository: xodiosx/termux-display-clientx
        path: termux-display-clientx   
       
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install meson -y
        
        
        sudo apt install -y \
          ninja-build \
          clang pkg-config \
          libpixman-1-dev \
          libwayland-dev \
          wayland-protocols \
          libegl1-mesa-dev \
          libdrm-dev \
          libxkbcommon-dev \
          libgbm-dev \
          libudev-dev \
          libinput-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shm0-dev \
          libxcb-xfixes0-dev

    - name: Build termux-display-client
      run: |
        cd termux-display-clientx
        meson setup build \
          --buildtype release \
          --prefix=$HOME/tdc-install
        ninja -C build
        ninja -C build install

    - name: Configure build
      run: |
        ls
        mkdir -p $HOME/tdc-install/lib/pkgconfig
        cat > $HOME/tdc-install/lib/pkgconfig/termux-display-client.pc <<EOF
        prefix=$HOME/tdc-install
        exec_prefix=\${prefix}
        libdir=\${prefix}/lib
        includedir=\${prefix}/include
        
        Name: termux-display-client
        Description: Termux display client library
        Version: 0.1
        Libs: -L\${libdir} -ltermux-display-client
        Cflags: -I\${includedir}
        EOF
        
        export PKG_CONFIG_PATH=$HOME/tdc-install/lib/pkgconfig:$PKG_CONFIG_PATH
    
        meson setup build \
          --buildtype release \
          -Drenderers=auto \
          -Dbackends=termuxdc \
          -Dwerror=false 
          

        ninja -C build

    - name: Archive build output
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: wlroots-binaries
        path: |
          wlroot/build/
