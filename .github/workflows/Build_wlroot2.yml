name: Build wlroots2

on:
  workflow_dispatch:
  push:
    branches: [wlroots-display-client]
  pull_request:
    branches: [wlroots-display-client]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/termux/termux-docker:latest

    steps:
    - name: Install required packages inside container
      run: |
        apt update
        apt install -y git wget unzip build-essential clang \
          automake autoconf libtool pkg-config ninja-build \
          cmake curl zip python3

    - name: Clone termux-packages
      uses: actions/checkout@v4
      with:
        repository: termux/termux-packages
        path: termux-packages

    - name: Create custom build.sh for wlroots-termux
      run: |
        mkdir -p termux-packages/x11-packages/wlroots-termux
        wget https://github.com/xodiosx/wlroots/archive/refs/heads/wlroots-display-client.tar.gz
        sha256=$(sha256sum wlroots-display-client.tar.gz | cut -d' ' -f1)
        cat > termux-packages/x11-packages/wlroots-termux/build.sh <<EOF
TERMUX_PKG_DESCRIPTION="Modular Wayland compositor library"
TERMUX_PKG_LICENSE="MIT"
TERMUX_PKG_MAINTAINER="@xodiosx"
TERMUX_PKG_VERSION=0.18.2
TERMUX_PKG_SRCURL=https://github.com/xodiosx/wlroots/archive/refs/heads/wlroots-display-client.tar.gz
TERMUX_PKG_SHA256=$sha256
TERMUX_PKG_AUTO_UPDATE=false

TERMUX_PKG_DEPENDS="libdrm, libglvnd, libwayland, libxcb, libxkbcommon, xcb-util-renderutil, xcb-util-wm, termux-gui-c, termux-display-client"
TERMUX_PKG_BUILD_DEPENDS="libglvnd-dev, libwayland-cross-scanner, libwayland-protocols, xwayland"
TERMUX_PKG_RECOMMENDS="xwayland"
TERMUX_PKG_BREAKS="sway (<< 1.10)"

TERMUX_PKG_EXTRA_CONFIGURE_ARGS="
  -Dexamples=true
  -Dxwayland=enabled
  -Dsession=disabled
  -Dbackends=x11,termuxgui,termuxdc
  -Drenderers=gles2,vulkan
"

termux_step_pre_configure() {
  export PATH="\$TERMUX_PREFIX/opt/libwayland/cross/bin:\$PATH"
  export CPPFLAGS+=" -Wno-alloca -Wno-strict-prototypes"
}
EOF

    - name: Move source tarball to correct location
      run: |
        mv wlroots-display-client.tar.gz termux-packages/

    - name: Build DEB with termux-packages
      working-directory: termux-packages
      run: |
        ./build-package.sh -a aarch64 x11-packages/wlroots-termux

    - name: Upload DEB artifact
      uses: actions/upload-artifact@v4
      with:
        name: wlroots-termux-deb
        path: termux-packages/output/*.deb
