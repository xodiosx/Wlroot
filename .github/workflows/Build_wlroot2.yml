name: Build wlroots2

on:
  workflow_dispatch:
  push:
    branches: [wlroots-display-client]
  pull_request:
    branches: [wlroots-display-client]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        repository: xodiosx/wlroots
        ref: wlroots-display-client
        submodules: recursive
            

    - name: Configure build
      run: |
        ls
        meson setup build \
          --buildtype release \
          -Drenderer=pixman \
          -Dbackends=termuxdc \
          -Dwerror=false

        ninja -C build

    - name: Archive build output
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: wlroots-binaries
        path: |
          wlroot/build/
