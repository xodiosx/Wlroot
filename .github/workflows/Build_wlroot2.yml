name: Build wlroot2a

on:
  workflow_dispatch:
  push:
    branches: [wlroots-display-client]
  pull_request:
    branches: [wlroots-display-client]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout wlroots repo
      uses: actions/checkout@v4
      with:
        repository: xodiosx/wlroots
        ref: wlroots-display-client
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          meson ninja-build pkg-config zip cmake clang gcc g++ \
          libpixman-1-dev libegl1-mesa-dev libdrm-dev \
          libxkbcommon-dev libgbm-dev libudev-dev libinput-dev \
          libxcb1-dev libxcb-render0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
          libffi-dev libxml2-dev graphviz libexpat1-dev

    - name: Install Android NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
        unzip android-ndk-r27c-linux.zip -d $HOME
        echo "ANDROID_NDK=$HOME/android-ndk-r27c" >> $GITHUB_ENV
        echo "$HOME/android-ndk-r27c" >> $GITHUB_PATH

    - name: Build and install Wayland 1.23.0 for Android
      run: |
        export NDK=$HOME/android-ndk-r27c
        export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
        export SYSROOT=$HOME/sysroot

        git clone https://gitlab.freedesktop.org/wayland/wayland.git
        cd wayland
        git checkout 1.23.0

        cat > android-cross.txt <<EOF
        [binaries]
        c = '$TOOLCHAIN/bin/aarch64-linux-android26-clang'
        cpp = '$TOOLCHAIN/bin/aarch64-linux-android26-clang++'
        ar = '$TOOLCHAIN/bin/llvm-ar'
        strip = '$TOOLCHAIN/bin/llvm-strip'
        pkgconfig = 'pkg-config'
        
        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'
        EOF

        meson setup build-android --cross-file android-cross.txt \
          --prefix=$SYSROOT \
          --buildtype=release \
          -Ddocumentation=false

        ninja -C build-android install

        echo "PKG_CONFIG_PATH=$SYSROOT/lib/pkgconfig" >> $GITHUB_ENV
        echo "CFLAGS=-I$SYSROOT/include" >> $GITHUB_ENV
        echo "LDFLAGS=-L$SYSROOT/lib" >> $GITHUB_ENV
        cd ..

    - name: Configure and build wlroots with Meson for Android
      run: |
        export NDK=$HOME/android-ndk-r27c
        export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
        export SYSROOT=$HOME/sysroot

        export AR=$TOOLCHAIN/bin/llvm-ar
        export CC=$TOOLCHAIN/bin/aarch64-linux-android26-clang
        export CXX=$TOOLCHAIN/bin/aarch64-linux-android26-clang++
        export PKG_CONFIG_PATH=$SYSROOT/lib/pkgconfig
        export CFLAGS="-I$SYSROOT/include"
        export LDFLAGS="-L$SYSROOT/lib"

        cat > android-cross.txt <<EOF
        [binaries]
        c = '$CC'
        cpp = '$CXX'
        ar = '$AR'
        pkgconfig = 'pkg-config'
        strip = '$TOOLCHAIN/bin/llvm-strip'
        
        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'
        EOF

        meson setup build \
          --cross-file android-cross.txt \
          --buildtype=release \
          --prefix=$SYSROOT \
          -Dbackends=termuxdc \
          -Dexamples=false \
          -Ddocumentation=false \
          -Dwerror=false \
          -Dxwayland=disabled

        ninja -C build

    - name: Zip build output
      run: |
        zip -r wlroots-arm64-build.zip build/

    - name: Upload zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: wlroots-arm64
        path: wlroots-arm64-build.zip
