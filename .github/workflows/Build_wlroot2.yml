name: Build wlroot2a

on:
  workflow_dispatch:
  push:
    branches: [wlroots-display-client]
  pull_request:
    branches: [wlroots-display-client]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout wlroots repo
      uses: actions/checkout@v4
      with:
        repository: xodiosx/wlroots
        ref: wlroots-display-client
        submodules: recursive

    - name: Write Meson cross-file
      run: |
        cat <<EOF > android-cross-file.txt
        [binaries]
        c = '$HOME/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
        cpp = '$HOME/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
         ar = '$HOME/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
         pkgconfig = 'pkg-config'
    
           [host_machine]
           system = 'android'
           cpu_family = 'aarch64'
           cpu = 'armv8-a'
            endian = 'little'
            EOF

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          meson ninja-build \
          pkg-config \
          wayland-protocols \
          libpixman-1-dev \
          zip cmake \
          clang pkg-config \
          gcc g++ \
          libpixman-1-dev \
          libwayland-dev \
          libegl1-mesa-dev \
          libdrm-dev \
          libxkbcommon-dev \
          libgbm-dev \
          libudev-dev \
          libinput-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shm0-dev \
          libxcb-xfixes0-dev \
          libffi-dev \
          libxml2-dev graphviz \
          libexpat1-dev wayland*


    - name: Build and install Wayland 1.23.0 (host + NDK sysroot)
      run: |
        git clone https://gitlab.freedesktop.org/wayland/wayland.git
        cd wayland
        git checkout 1.23.0

        # 1. Host install (needed for wayland-scanner)
        meson setup build-host --prefix=/usr -Ddocumentation=false
        ninja -C build-host
        sudo ninja -C build-host install

        # 2. Set up sysroot (for Android)
        mkdir -p $GITHUB_WORKSPACE/sysroot/include
        mkdir -p $GITHUB_WORKSPACE/sysroot/lib/pkgconf
          meson setup build \
          --cross-file android-cross-file.txt \
           --prefix=$GITHUB_WORKSPACE/sysroot \
           --buildtype=release \
           -Dbackends=termuxdc \
           -Drenderers=auto \
           -Dwerror=false

           ninja -C build
           
            cd ..
        
    
    - name: Install Android NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
        unzip android-ndk-r27c-linux.zip -d $HOME
        echo "ANDROID_NDK=$HOME/android-ndk-r27c" >> $GITHUB_ENV
        echo "$HOME/android-ndk-r27c" >> $GITHUB_PATH



    - name: Configure and build wlroots with Meson for Android
      run: |
        export NDK=$HOME/android-ndk-r27c
        export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
        export SYSROOT=$HOME/sysroot
        ls /usr/include/wayland/wayland-util.h
        export AR=$TOOLCHAIN/bin/llvm-ar
        export CC=$TOOLCHAIN/bin/aarch64-linux-android26-clang
        export CXX=$TOOLCHAIN/bin/aarch64-linux-android26-clang++
        export PKG_CONFIG_PATH=$SYSROOT/lib/pkgconfig
        export CFLAGS="-I$SYSROOT/include"
        export LDFLAGS="-L$SYSROOT/lib"
        export CFLAGS="-I/usr/include/wayland"
        export CXXFLAGS="-I/usr/include/wayland"
        cat > android-cross.txt <<EOF
        [binaries]
  meson setup build \
      --cross-file android-cross-file.txt \
      --prefix=$GITHUB_WORKSPACE/sysroot \
      --buildtype=release \
      -Dbackends=termuxdc \
      -Drenderers=auto \
      -Dwerror=false

    ninja -C build      c = '$CC'
        cpp = '$CXX'
        ar = '$AR'
        pkg-config = 'pkg-config'
        strip = '$TOOLCHAIN/bin/llvm-strip'
        
        cat > android-cross.txt <<EOF
        [binaries]
        c = '$CC'
        cpp = '$CXX'
        ar = '$AR'
        pkg-config = 'pkg-config'
        strip = '$TOOLCHAIN/bin/llvm-strip'
        
        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'
        EOF

        meson setup build \
          --cross-file android-cross.txt \
          --buildtype=release \
          --prefix=$SYSROOT \
          -Dbackends=termuxdc \
          -Dexamples=false \
          -Dwerror=false \
          -Dxwayland=disabled

        ninja -C build

    - name: Zip build output
      run: |
        zip -r wlroots-arm64-build.zip build/

    - name: Upload zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: wlroots-arm64
        path: wlroots-arm64-build.zip
