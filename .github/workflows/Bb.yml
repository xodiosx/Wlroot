name: Build Termux packages (wlroots + display client)

on:
  workflow_dispatch:
  push:
    branches: [wlroots-display-client]
  pull_request:
    branches: [wlroots-display-client]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout termux-packages
      uses: actions/checkout@v4
      with:
        repository: termux/termux-packages
        path: termux-packages

    - name: Clone source projects
      run: |
        git clone --depth=1 --branch wlroots-display-client https://github.com/xodiosx/wlroots.git
        git clone --depth=1 https://github.com/xodiosx/termux-display-clientx.git

    - name: Move source into termux-packages/packages
      run: |
        mkdir -p termux-packages/packages/wlroots-display
        mkdir -p termux-packages/packages/termux-display-clientx

        cp -r wlroots/* termux-packages/packages/wlroots-display/
        cp -r termux-display-clientx/* termux-packages/packages/termux-display-clientx/

    - name: Create build.sh for wlroots
      run: |
        cat > termux-packages/packages/wlroots-display/build.sh << 'EOF'
        TERMUX_PKG_HOMEPAGE="https://github.com/xodiosx/wlroots"
        TERMUX_PKG_DESCRIPTION="Termux compatible wlroots fork with termuxdc backend"
        TERMUX_PKG_LICENSE="MIT"
        TERMUX_PKG_MAINTAINER="@xodiosx"
        TERMUX_PKG_VERSION=0.18.2
        TERMUX_PKG_SRCURL="."
        TERMUX_PKG_DEPENDS="libwayland, libxkbcommon, libpixman"
        TERMUX_PKG_BUILD_IN_SRC=true
        TERMUX_PKG_EXTRA_CONFIGURE_ARGS="-Dbackends=termuxdc -Drenderers=pixman -Dwerror=false"

        termux_step_configure() {
        meson setup build \
        --prefix=$TERMUX_PREFIX \
        --buildtype=release \
        $TERMUX_PKG_EXTRA_CONFIGURE_ARGS
        }

        termux_step_make() {
        ninja -C build
        }

        termux_step_make_install() {
        ninja -C build install
        }
         EOF

    - name: Create build.sh for termux-display-clientx
      run: |
        cat > termux-packages/packages/termux-display-clientx/build.sh << 'EOF'
         TERMUX_PKG_HOMEPAGE="https://github.com/xodiosx/termux-display-clientx"
         TERMUX_PKG_DESCRIPTION="Display client for rendering X/Wayland in Termux"
         TERMUX_PKG_LICENSE="MIT"
         TERMUX_PKG_MAINTAINER="@xodiosx"
         TERMUX_PKG_VERSION=1.0.0
         TERMUX_PKG_SRCURL="."
         TERMUX_PKG_BUILD_IN_SRC=true

        termux_step_make() {
          mkdir -p build
         cd build
         cmake .. -DCMAKE_INSTALL_PREFIX=$TERMUX_PREFIX -DCMAKE_BUILD_TYPE=Release
         make -j$(nproc)
                           }

          termux_step_make_install() {
           cd build
           make install
              }
           EOF

    - name: Build in termux docker
      run: |
        docker run --rm -v $PWD/termux-packages:/home/builder \
          -e PACKAGES="termux-display-clientx wlroots-display" \
          ghcr.io/termux/package-builder:latest

    - name: Upload DEBs
      uses: actions/upload-artifact@v4
      with:
        name: termux-debs
        path: termux-packages/output/*.deb
