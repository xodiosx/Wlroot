name: Build wlroots + termux-display-clientx (Termux DEBs)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git tar xz-utils python3

    - name: Clone termux-packages
      uses: actions/checkout@v4
      with:
        repository: termux/termux-packages
        path: termux-packages

    - name: Clone wlroots and display client repos
      run: |
        git clone --depth=1 --branch wlroots-display-client https://github.com/xodiosx/wlroots.git
        git clone --depth=1 https://github.com/xodiosx/termux-display-clientx.git

    - name: Archive source directories into .tar.xz
      run: |
        tar -cJf wlroots.tar.xz wlroots
        tar -cJf termux-display-clientx.tar.xz termux-display-clientx

    - name: Prepare termux-packages folders
      run: |
        mkdir -p termux-packages/packages/wlroots-display
        mkdir -p termux-packages/packages/termux-display-clientx

        mv wlroots.tar.xz termux-packages/packages/wlroots-display/
        mv termux-display-clientx.tar.xz termux-packages/packages/termux-display-clientx/

    - name: Create wlroots build.sh
      run: |
        cat << 'EOF' > termux-packages/packages/wlroots-display/build.sh
TERMUX_PKG_HOMEPAGE="https://github.com/xodiosx/wlroots"
TERMUX_PKG_DESCRIPTION="Termux-compatible wlroots fork with termuxdc backend"
TERMUX_PKG_LICENSE="MIT"
TERMUX_PKG_MAINTAINER="@xodiosx"
TERMUX_PKG_VERSION=0.18.2
TERMUX_PKG_SRCURL=file://\${TERMUX_PKG_BUILDER_DIR}/wlroots.tar.xz
TERMUX_PKG_DEPENDS="libwayland, libxkbcommon, libpixman"
TERMUX_PKG_EXTRA_CONFIGURE_ARGS="-Dbackends=termuxdc -Drenderers=pixman -Dwerror=false"
TERMUX_PKG_BUILD_IN_SRC=true
EOF

    - name: Create termux-display-clientx build.sh
      run: |
        cat << 'EOF' > termux-packages/packages/termux-display-clientx/build.sh
TERMUX_PKG_HOMEPAGE="https://github.com/xodiosx/termux-display-clientx"
TERMUX_PKG_DESCRIPTION="Display client for rendering X/Wayland in Termux"
TERMUX_PKG_LICENSE="MIT"
TERMUX_PKG_MAINTAINER="@xodiosx"
TERMUX_PKG_VERSION=1.0.0
TERMUX_PKG_SRCURL=file://\${TERMUX_PKG_BUILDER_DIR}/termux-display-clientx.tar.xz
TERMUX_PKG_DEPENDS=""
TERMUX_PKG_BUILD_IN_SRC=true

termux_step_make() {
  mkdir -p build
  cd build
  cmake .. -DCMAKE_INSTALL_PREFIX=\$TERMUX_PREFIX -DCMAKE_BUILD_TYPE=Release
  make -j\$(nproc)
}

termux_step_make_install() {
  cd build
  make install
}
EOF

    - name: Build DEBs in termux-packages container
      run: |
        docker run --rm -v $PWD/termux-packages:/home/builder \
          -e PACKAGES="termux-display-clientx wlroots-display" \
          ghcr.io/termux/package-builder:latest

    - name: Upload DEB artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deb-packages
        path: termux-packages/output/*.deb
