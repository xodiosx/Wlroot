name: Build wlroots-display-client

on:
  push:
    branches: [wlroots-display-client]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        renderer: [pixman, termwdc]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y meson ninja-build pkg-config \
          libwayland-dev wayland-protocols libdrm-dev \
          libgbm-dev libegl1-mesa-dev libxkbcommon-dev pixman \
          libgles2-mesa-dev

    - name: Setup Xvfb for headless
      run: |
        sudo apt install -y xvfb
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 &
    
    - name: Configure & build wlroots (${{ matrix.renderer }})
      run: |
        cd wlroots
        rm -rf build-${{ matrix.renderer }}
        meson setup build-${{ matrix.renderer }} \
          --buildtype release \
          -Drenderer=${{ matrix.renderer }} \
          -Dbackends=termuxdc \
          -Dwerror=false
        meson compile -C build-${{ matrix.renderer }} || true

    - name: Upload build logs
      uses: actions/upload-artifact@v3
      with:
        name: wlroots-${{ matrix.renderer }}-logs
        path: |
          wlroots/build-${{ matrix.renderer }}/meson-logs/
